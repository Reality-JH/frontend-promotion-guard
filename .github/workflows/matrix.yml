name: Cross-platform guard checks
on:
  push:
  pull_request:
jobs:
  node-and-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run license:check
      - run: npm run example:build
      - name: Browser-backed verify
        shell: bash
        run: |
          npm run example:serve > fpg-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173 && break; sleep 1; done
          node dist/cli.js verify --config fpg.example.yml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpg-evidence-${{ matrix.os }}
          path: release-evidence
  docker-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --tag fpg-demo:ci --file examples/vite-react/Dockerfile .
