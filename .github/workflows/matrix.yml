name: Cross-platform guard checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-and-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run license:check
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run example:build
      - name: Browser-backed verify
        shell: bash
        run: |
          npm run example:serve > fpg-server.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:4173 && break; sleep 1; done
          node dist/cli.js verify --config fpg.example.yml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpg-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: release-evidence
  docker-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: npm run build
      - run: npm run example:build
      - run: npm run test:docker
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpg-docker-integration-evidence
          path: release-evidence/docker-integration
