name: Frontend Promotion Guard
description: Audit CSS and run computed-style and visual regression gates.
inputs:
  config:
    description: Path to the FPG YAML configuration in the caller repository.
    required: false
    default: fpg.yml
  command:
    description: FPG command (audit, verify, capture, compare, promote, report).
    required: false
    default: verify
runs:
  using: composite
  steps:
    - name: Install Frontend Promotion Guard runtime
      shell: bash
      run: npm ci --omit=dev --ignore-scripts --prefix "${{ github.action_path }}"
    - name: Run Frontend Promotion Guard
      shell: bash
      env:
        FPG_ACTION_COMMAND: ${{ inputs.command }}
        FPG_ACTION_CONFIG: ${{ inputs.config }}
      run: |
        case "$FPG_ACTION_COMMAND" in
          audit|capture|compare|verify|promote|report)
            node "${{ github.action_path }}/dist/cli.js" "$FPG_ACTION_COMMAND" --config "$FPG_ACTION_CONFIG"
            ;;
          *)
            echo "Unsupported Frontend Promotion Guard Action command: $FPG_ACTION_COMMAND" >&2
            exit 2
            ;;
        esac
