baseUrl: http://127.0.0.1:4173

routes:
  - name: home
    path: /
    readySelector: main
    # Optional per route: waitUntil (load|domcontentloaded|networkidle|commit), fullPage (boolean)
  - name: details
    path: /details
    readySelector: "[data-page=details]"

viewports:
  - { width: 1440, height: 1000 }
  - { width: 1280, height: 900 }
  - { width: 1024, height: 900 }
  - { width: 768, height: 900 }

cssAudit:
  files:
    - examples/vite-react/dist/assets/*.css
  forbiddenTokens: ["@theme", "@utility", "@custom-variant", "@apply"]
  requiredSelectors: [".flex", ".grid", ".hidden"]

computedStyles:
  - selector: main
    property: display
    notEquals: none
  - selector: ".status-grid"
    property: display
    equals: grid

visual:
  maxDiffPixelRatio: 0.12
  pixelThreshold: 0.2
  baselineDir: ./visual-baselines
  evidenceDir: ./release-evidence
  retention: 10
  # Selectors masked out of the pixel diff (ads, timestamps, carousels).
  maskSelectors: []
  # Capture and diff a Playwright ARIA snapshot per route and viewport.
  ariaSnapshot: false
  # warn reports changes without failing the gate; fail is the default.
  ariaSnapshotMode: fail
  # Freeze page clocks at an ISO 8601 instant, e.g. freezeTime: "2026-01-01T00:00:00Z"
  # fullPage: false

docker:
  candidateImage: fpg-demo:candidate
  productionImage: fpg-demo:latest
  candidatePort: 43100
  productionPort: 43000
  containerPort: 8080
  candidateContainer: fpg-demo-candidate
  productionContainer: fpg-demo-production
  buildContext: .
  dockerfile: examples/vite-react/Dockerfile
  healthPath: /
  rollback: true
  # Require a digest or image ID when promoting an existing candidate or rolling back.
  # A candidate built by FPG is resolved to its image ID automatically.
  requireImmutableImage: false
